<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Digimon World - web port</title>
<style>
  body { background: #111; color: #ccc; font-family: monospace; margin: 2em; }
  #canvas { border: 1px solid #444; display: block; margin: 1em 0;
    width: 640px; height: 480px; image-rendering: pixelated; }
  #status { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Digimon World (web port)</h1>
<input type="file" id="disc" accept=".bin">
<label for="disc">Select your Digimon World (USA) .bin</label>
<canvas id="canvas" width="320" height="240"></canvas>
<div>
  <button id="exportSave">Export save</button>
  <label>Import save <input type="file" id="importSave" accept=".mcr"></label>
</div>
<div id="status">waiting for disc...</div>
<div id="audioHint">click the canvas or file picker to enable audio</div>
<script>
var statusEl = document.getElementById('status');

/* Disc source abstraction: either a File from the picker (read via
 * Blob.slice, no full-file memory copy) or a fully fetched ArrayBuffer
 * from ?disc=<url>. The game waits on Module.disc.ready (CdInit blocks
 * inside Asyncify until a disc is attached). */
var discSource = null; /* {readRaw(off, len) -> Promise<Uint8Array>} */
var discResolve;
var discReady = new Promise(function (r) { discResolve = r; });

function attachSource(src) {
  if (discSource) return;
  discSource = src;
  discResolve(src);
}

Module = {
  canvas: document.getElementById('canvas'),
  /* Mount IDBFS at /memcard and pull persisted card images before
   * dw_main starts (run dependency delays main until syncfs(true)
   * finishes). Skipped headless (no IndexedDB). */
  preRun: function () {
    if (typeof indexedDB === 'undefined') return;
    addRunDependency('memcard');
    try { FS.mkdir('/memcard'); } catch (e) {}
    FS.mount(IDBFS, {}, '/memcard');
    FS.syncfs(true, function (err) {
      if (err) console.warn('memcard syncfs(load): ' + err);
      removeRunDependency('memcard');
    });
  },
  print: function (s) {
    statusEl.textContent += s + "\n";
    console.log(s);
  },
  printErr: function (s) { console.warn(s); },
  disc: {
    ready: discReady,
    /* readRaw(lba, nsec) -> Promise<Uint8Array> of nsec*2352 bytes */
    readRaw: function (lba, nsec) {
      var off = lba * 2352, len = nsec * 2352;
      return discSource.readRaw(off, len);
    },
    /* readUser(lba, nsec) -> Promise<Uint8Array> of nsec*2048 bytes */
    readUser: function (lba, nsec) {
      return Module.disc.readRaw(lba, nsec).then(function (raw) {
        var out = new Uint8Array(nsec * 2048);
        for (var i = 0; i < nsec; ++i) {
          var base = i * 2352;
          var mode = raw[base + 15];
          var userOff = base + (mode === 2 ? 24 : 16);
          out.set(raw.subarray(userOff, userOff + 2048), i * 2048);
        }
        return out;
      });
    },
  },
};

document.getElementById('disc').addEventListener('change', function (e) {
  var f = e.target.files[0];
  if (!f) return;
  statusEl.textContent = 'disc attached: ' + f.name +
    ' (' + f.size + ' bytes)\n';
  attachSource({
    readRaw: function (off, len) {
      return f.slice(off, off + len).arrayBuffer()
        .then(function (b) { return new Uint8Array(b); });
    },
  });
});

/* Audio autoplay: resume the SDL audio device on the first user
 * gesture (file pick or canvas click). */
var audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  if (Module.ccall) {
    try { Module.ccall('web_audio_resume', null, [], []); } catch (e) {}
  }
  var el = document.getElementById('audioHint');
  if (el) el.textContent = '';
}
document.getElementById('disc').addEventListener('click', unlockAudio);
document.getElementById('canvas').addEventListener('click', unlockAudio);

/* Save export/import: card0.mcr is a raw 128 KiB .mcr image (loads in
 * DuckStation/PCSX). Export downloads the MEMFS copy; import replaces
 * it and reloads the live card image. */
document.getElementById('exportSave').addEventListener('click', function () {
  try {
    var data = FS.readFile('/memcard/card0.mcr');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data]));
    a.download = 'dw_save_card0.mcr';
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) {
    statusEl.textContent += 'export failed: ' + e + '\n';
  }
});
document.getElementById('importSave').addEventListener('change', function (e) {
  var f = e.target.files[0];
  if (!f) return;
  f.arrayBuffer().then(function (buf) {
    if (buf.byteLength !== 0x20000) {
      statusEl.textContent += 'import rejected: not 128 KiB\n';
      return;
    }
    FS.writeFile('/memcard/card0.mcr', new Uint8Array(buf));
    FS.syncfs(false, function () {});
    if (Module.ccall)
      Module.ccall('web_mc_reload', null, ['number'], [0]);
    statusEl.textContent += 'save imported: ' + f.name + '\n';
  });
});

var m = location.search.match(/[?&]disc=([^&]+)/);
if (m) {
  statusEl.textContent = 'fetching disc ' + decodeURIComponent(m[1]) + ' ...\n';
  fetch(decodeURIComponent(m[1])).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.arrayBuffer();
  }).then(function (buf) {
    var u8 = new Uint8Array(buf);
    statusEl.textContent = 'disc fetched: ' + u8.length + ' bytes\n';
    attachSource({
      readRaw: function (off, len) {
        return Promise.resolve(u8.subarray(off, off + len));
      },
    });
  }).catch(function (err) {
    statusEl.textContent = 'disc fetch failed: ' + err + '\n';
  });
}
</script>
<script src="dw.js"></script>
</body>
</html>
